name: Add deb to APT repository

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Build and notify APT repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh "${VERSION}"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if ! gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes "Release v${VERSION}"
          fi
          gh release upload "v${VERSION}" \
            "build/strix-runner-dashboard_${VERSION}-1_amd64.deb" \
            "build/strix-runner-dashboard_${VERSION}-1_amd64.deb.sha256" \
            --clobber

      - name: Notify strix-runner APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -e
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Mikehenrytech/strix-runner/dispatches \
            -d "{
              \"event_type\": \"dashboard-release\",
              \"client_payload\": {
                \"dashboard_version\": \"${VERSION}\"
              }
            }"
