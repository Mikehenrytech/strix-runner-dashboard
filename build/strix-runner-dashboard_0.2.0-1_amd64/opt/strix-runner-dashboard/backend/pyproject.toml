[project]
name = "strix-dashboard"
version = "0.2.0"
description = "Read-only web dashboard for Strix execution history"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
strix-dashboard = "strix_dashboard.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
]
